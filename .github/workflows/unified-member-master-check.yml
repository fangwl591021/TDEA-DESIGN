name: Verify unified member master sync
on:
  push:
    paths:
      - 'src/profile-phone-entry.js'
      - '.github/workflows/unified-member-master-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run
