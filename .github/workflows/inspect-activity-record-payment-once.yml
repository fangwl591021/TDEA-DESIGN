name: Inspect activity record payment once
on:
  push:
    branches: [agent/full-project-transplant]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
      - name: Inspect activity record payment UI and routes
        shell: bash
        run: |
          echo '=== APP activity record refs ==='
          grep -n -E 'activity.*record|活動紀錄|registration.*record|native-registrations|payment|remittance|取消報名|核銷 QR' public/app-20260803-123.js | head -320 || true
          echo '=== INDEX proxy refs ==='
          grep -n -E 'activity.*record|native-registrations|TDEA_WORKER|payment-report|payment' src/index.js | head -320 || true
