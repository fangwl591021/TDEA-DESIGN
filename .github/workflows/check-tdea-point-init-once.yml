name: Check TDEA point initialization bridge

on:
  push:
    branches:
      - fix/tdea-point-service-bridge
    paths:
      - .github/workflows/check-tdea-point-init-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-point-service-bridge
      - run: node --check src/tdea-point-service.js
      - run: node --check src/index.js
      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-tdea-point-init-once.yml
          git commit -m 'Remove one-time point init check'
          git push origin HEAD:fix/tdea-point-service-bridge
