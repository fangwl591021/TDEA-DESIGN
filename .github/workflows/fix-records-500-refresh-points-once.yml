name: Fix activity records 500 and refresh points once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/fix-records-500-refresh-points-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/fix-records-500-refresh-points.py
      - name: Verify
        shell: bash
        run: |
          node --check src/index.js
          node --check public/app-20260803-123.js
          grep -q 'currentVerifiedLineUserId' src/index.js
          grep -q 'tdeawork.fangwl591021.workers.dev/api/native-registrations/me' src/index.js
          grep -q 'refreshVisibleTdeaPointBalance' public/app-20260803-123.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/index.js public/app-20260803-123.js
          git commit -m "Fix inline activity records and refresh points after checkin"
          git rm .github/workflows/fix-records-500-refresh-points-once.yml .github/scripts/fix-records-500-refresh-points.py
          git commit -m "Remove one-time records refresh patch files"
          git push origin agent/full-project-transplant
