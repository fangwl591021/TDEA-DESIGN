name: Pass LINE UID to activity records once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/pass-line-uid-to-activity-records-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply identity handoff patch
        run: python .github/scripts/pass-line-uid-to-activity-records.py
      - name: Verify
        shell: bash
        run: |
          node --check public/app-20260803-123.js
          grep -q "url.searchParams.set('lineUserId', uid)" public/app-20260803-123.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add public/app-20260803-123.js
          git commit -m "Carry signed-in LINE identity into activity records"
          git rm .github/workflows/pass-line-uid-to-activity-records-once.yml .github/scripts/pass-line-uid-to-activity-records.py
          git commit -m "Remove one-time activity identity patch files"
          git push origin agent/full-project-transplant
