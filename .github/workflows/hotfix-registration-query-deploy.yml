name: Hotfix registration query deploy
on:
  push:
    paths:
      - '.github/workflows/hotfix-registration-query-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check public/registration-query-restore.js
      - run: node --check public/daily-checkin-direct.js
      - run: node --check public/ad-reward-direct-v3.js
      - run: node --check src/ad-reward-no-link-entry.js
      - run: node --check src/remittance-entry.js
      - name: Deploy tdea-design
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
# deploy workflow requires Node 22 as of Wrangler 4.111+
