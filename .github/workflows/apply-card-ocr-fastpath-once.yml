name: Apply card OCR fast path once

on:
  push:
    branches: [fix/ocr-gate-before-card-ai]
    paths: [.github/workflows/apply-card-ocr-fastpath-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ocr-gate-before-card-ai
      - name: Make first-pass OCR non-blocking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/card-collection.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function recognizeWithOpenAI(apiKey, model, images) {')
          end=s.index('\n// 使用 Responses 的 web_search 工具', start)
          replacement='''async function recognizeWithOpenAI(apiKey, model, images) {\n  const content = [{ type:'input_text', text:`辨識這張商務名片。只擷取畫面中可確認的文字，不猜測；無法確認的欄位填空字串。若不是名片，isBusinessCard=false。繁體中文內容保留原文。note 僅放無法歸類但有價值的名片文字。\n並依公司、職稱、部門與服務說明做一次行業分類：主行業只能選 1 個，次行業最多 2 個且不可與主行業相同。可選行業為：${INDUSTRY_OPTIONS.join('、')}。無法可靠判斷時 primaryIndustry 填「待分類」、secondaryIndustries 填空陣列；industryConfidence 填 0 到 1。` },...businessCardImages(images)];\n  const result=await callAiResponses(apiKey,{\n    model:model || 'gpt-5.6-terra',reasoning:{effort:'low'},max_output_tokens:1800,\n    input:[{role:'user',content}],\n    text:{format:{type:'json_schema',name:'business_card',strict:true,schema:OCR_SCHEMA}},\n  });\n  const value=outputText(result);\n  if(!value)throw new Error('AI 未回傳名片辨識結果');\n  return JSON.parse(value);\n}\n'''
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          PY
      - name: Check
        run: |
          npm install
          npm run check
          npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/card-collection.js
          git diff --cached --check
          git commit -m "Make initial card OCR non-blocking"
          git push origin HEAD:fix/ocr-gate-before-card-ai
