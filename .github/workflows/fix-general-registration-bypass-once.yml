name: Fix general registration bypass once
on:
  push:
    paths:
      - '.github/workflows/fix-general-registration-bypass-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          s=p.read_text(encoding='utf-8')
          old='''      const profile = (await readJson(request)) || {};
      const rosterVerification = await verifyTdeaRosterMember(env.TDEA_WORKER, env.TDEA_DESIGN_LOOKUP_SECRET, profile);
      const updated = await updateMemberProfile(
'''
          new='''      const profile = (await readJson(request)) || {};
      const memberType = String(profile.memberType || '').trim().toLowerCase();
      const rosterVerification = memberType === 'general'
        ? { memberType: 'general', memberNumber: '', rosterName: '', source: 'self_registration' }
        : await verifyTdeaRosterMember(env.TDEA_WORKER, env.TDEA_DESIGN_LOOKUP_SECRET, profile);
      const updated = await updateMemberProfile(
'''
          if old not in s:
              raise SystemExit('registration anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check src/index.js
          grep -n -A8 -B3 "memberType === 'general'" src/index.js
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-general-registration-bypass-once.yml .github/workflows/inspect-general-register-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js .github/workflows
          git commit -m "Allow general member self registration without roster lookup"
          git push origin HEAD:agent/full-project-transplant
