name: Speed and direct checkin once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/speed-direct-checkin-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/speed-direct-checkin.py
      - name: Verify
        shell: bash
        run: |
          node --check src/tdea-point-service.js
          node --check src/daily-ad.js
          node --check public/app-20260803-123.js
          grep -q '/internal/tdea/member/' src/tdea-point-service.js
          grep -q "compact') === '1'" src/tdea-point-service.js
          ! grep -q 'watch_requirement_not_met' src/daily-ad.js
          grep -q 'directDailyCheckin' public/app-20260803-123.js
          grep -q 'data-activity-records' public/app-20260803-123.js
          git diff --check
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/tdea-point-service.js src/daily-ad.js public/app-20260803-123.js
          git commit -m "Speed member actions and make daily checkin direct"
          git rm .github/workflows/speed-direct-checkin-once.yml .github/scripts/speed-direct-checkin.py
          git commit -m "Remove one-time speed patch files"
          git push origin agent/full-project-transplant