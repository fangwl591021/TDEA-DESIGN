name: Inspect calendar wiring once
on:
  push:
    branches: [agent/full-project-transplant]
    paths: [.github/workflows/inspect-calendar-wiring-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
      - name: Inspect calendar wiring
        shell: bash
        run: |
          echo '=== APP calendar references ==='
          grep -n -E 'function (calendar|personalCalendar)|async function (calendar|personalCalendar)|calendarSessions|personal-calendar|personal/calendar|data-tab=.calendar|state\.tab.*calendar' public/app-20260803-123.js | head -160 || true
          echo '=== INDEX personal calendar routes ==='
          grep -n -E 'listPersonalCalendar|savePersonalCalendarEvent|deletePersonalCalendarEvent|createCalendarLabel|personal-calendar|calendar/voice' src/index.js | head -160 || true
