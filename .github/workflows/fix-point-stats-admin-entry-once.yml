name: Fix point stats admin entry once

on:
  push:
    paths:
      - '.github/workflows/fix-point-stats-admin-entry-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Include slashless admin route
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/point-stats-entry.js')
          text = path.read_text(encoding='utf-8')
          old = "['/admin/','/admin/index.html','/admin.html'].includes(url.pathname)"
          new = "['/admin','/admin/','/admin/index.html','/admin.html'].includes(url.pathname)"
          if old not in text:
              raise SystemExit('target route list not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify
        run: |
          grep -F "['/admin','/admin/','/admin/index.html','/admin.html']" src/point-stats-entry.js
          node --check src/point-stats-entry.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/point-stats-entry.js
          git commit -m 'fix: inject point stats link on slashless admin route'
          git push origin HEAD:agent/full-project-transplant
