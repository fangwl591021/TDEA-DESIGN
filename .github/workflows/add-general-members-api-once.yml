name: Add general members API once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/add-general-members-api-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add-general-members-api.py
      - name: Verify
        shell: bash
        run: |
          node --check src/tdea-point-service.js
          grep -q "'/internal/tdea/points/members'" src/tdea-point-service.js
          grep -q "pointBalance: Number(row.point_balance" src/tdea-point-service.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/tdea-point-service.js
          git commit -m "Expose canonical general members internally"
          git rm .github/workflows/add-general-members-api-once.yml .github/scripts/add-general-members-api.py
          git commit -m "Remove one-time general member API patch files"
          git push origin agent/full-project-transplant
