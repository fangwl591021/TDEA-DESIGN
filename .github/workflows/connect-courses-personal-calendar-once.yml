name: Connect courses to personal calendar once
on:
  push:
    branches: [agent/full-project-transplant]
    paths: [.github/workflows/connect-courses-personal-calendar-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/connect-courses-to-personal-calendar.py
      - name: Verify
        shell: bash
        run: |
          node --check src/personal-calendar.js
          node --check public/app-20260803-123.js
          grep -q 'sourceType: "company", name: "活動／課程"' src/personal-calendar.js
          grep -q 'listMyCourseSessions' src/personal-calendar.js
          grep -q 'courseSessionId' src/personal-calendar.js
          grep -q '活動／課程' public/app-20260803-123.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/personal-calendar.js public/app-20260803-123.js
          git commit -m "Show registered activities in personal calendar"
          git rm .github/workflows/connect-courses-personal-calendar-once.yml .github/scripts/connect-courses-to-personal-calendar.py .github/workflows/inspect-calendar-wiring-once.yml
          git commit -m "Remove one-time calendar patch files"
          git push origin agent/full-project-transplant
