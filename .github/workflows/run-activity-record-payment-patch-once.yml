name: Run activity record payment patch once
on:
  push:
    branches: [agent/full-project-transplant]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-activity-record-payment.py
      - name: Verify
        run: |
          node --check public/app-20260803-123.js
          node --check src/index.js
          grep -q 'tdeaRecordPaymentMarkup' public/app-20260803-123.js
          grep -q '/v1/tdea-activity-records/payment-report' src/index.js
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/app-20260803-123.js src/index.js
          git commit -m 'Show remittance info in activity records'
          git push origin HEAD:agent/full-project-transplant
          git rm -f .github/scripts/patch-activity-record-payment.py .github/workflows/run-activity-record-payment-patch-once.yml .github/workflows/add-activity-record-payment-ui-once.yml .github/workflows/inspect-activity-record-payment-once.yml || true
          git commit -m 'Remove one-time activity record patch files'
          git push origin HEAD:agent/full-project-transplant
