name: Fix internal member route once v2
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/fix-internal-member-route-once-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Fix route guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/tdea-point-service.js')
          s=p.read_text(encoding='utf-8')
          old="  if (!url.pathname.startsWith('/internal/tdea/points')) return null;"
          new="  if (!url.pathname.startsWith('/internal/tdea/points') && !url.pathname.startsWith('/internal/tdea/member')) return null;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('route guard anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          node --check src/tdea-point-service.js
          grep -Fq "!url.pathname.startsWith('/internal/tdea/points') && !url.pathname.startsWith('/internal/tdea/member')" src/tdea-point-service.js
          grep -Fq "const memberMatch = url.pathname.match" src/tdea-point-service.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/tdea-point-service.js
          git commit -m "Allow canonical member lookup route"
          git rm .github/workflows/fix-internal-member-route-once-v2.yml .github/workflows/fix-internal-member-route-once.yml || true
          git commit -m "Remove one-time member route workflows" || true
          git push origin agent/full-project-transplant
