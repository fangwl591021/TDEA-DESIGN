name: Remove daily card and inline activity records once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/remove-daily-card-inline-records-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/remove-daily-card-inline-records.py
      - name: Verify
        shell: bash
        run: |
          node --check src/index.js
          node --check public/app-20260803-123.js
          grep -q '/v1/tdea-activity-records' src/index.js
          grep -q 'data-direct-daily-checkin' public/app-20260803-123.js
          grep -q 'showTdeaActivityRecords' public/app-20260803-123.js
          grep -q 'dailyPanel: "ads"' public/app-20260803-123.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/index.js public/app-20260803-123.js
          git commit -m "Remove daily checkin card and inline activity records"
          git rm .github/workflows/remove-daily-card-inline-records-once.yml .github/scripts/remove-daily-card-inline-records.py
          git commit -m "Remove one-time inline records patch files"
          git push origin agent/full-project-transplant