name: Remove card reward pending alert once
on:
  push:
    branches: [agent/full-project-transplant]
    paths: [.github/workflows/remove-card-reward-pending-alert-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
      - name: Remove blocking pending reward alert
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app-20260803-123.js')
          s=p.read_text(encoding='utf-8')
          old='      if(submitted.reward?.status==="pending_validation")alert("名片辨識完成並確認不是重複收藏後，將自動贈送 10 K點。");\n'
          if old not in s:
              raise SystemExit('target pending reward alert not found')
          s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          ! grep -F '名片辨識完成並確認不是重複收藏後，將自動贈送 10 K點。' public/app-20260803-123.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app-20260803-123.js
          git commit -m 'fix: remove blocking card reward pending alert'
          git push origin HEAD:agent/full-project-transplant
