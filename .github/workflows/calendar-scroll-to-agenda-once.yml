name: Calendar scroll to agenda once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/calendar-scroll-to-agenda-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/calendar-scroll-to-agenda.py
      - name: Verify
        run: |
          node --check public/app-20260803-123.js
          grep -q 'personal-calendar-agenda.*scrollIntoView' public/app-20260803-123.js || grep -q 'scrollIntoView({behavior:"smooth",block:"start"})' public/app-20260803-123.js
      - name: Commit and cleanup
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add public/app-20260803-123.js
          git commit -m "Scroll calendar date selection to agenda"
          git rm .github/workflows/calendar-scroll-to-agenda-once.yml .github/scripts/calendar-scroll-to-agenda.py
          git commit -m "Remove one-time calendar scroll patch files"
          git push origin agent/full-project-transplant
