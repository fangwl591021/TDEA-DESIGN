name: Guard LINE UID member conflict once

on:
  push:
    branches:
      - fix/line-uid-member-conflict
    paths:
      - .github/workflows/guard-line-uid-member-conflict-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/line-uid-member-conflict
          fetch-depth: 0

      - name: Patch conflict guard only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tdea-point-service.js')
          text = path.read_text(encoding='utf-8')

          old = """  let userId = await userIdFromLineUid(db, lineUserId);\n  let created = false;\n  let attached = false;\n"""
          new = """  let userId = await userIdFromLineUid(db, lineUserId);\n  const matchedByLine = Boolean(userId);\n  let created = false;\n  let attached = false;\n"""
          if text.count(old) != 1:
              raise SystemExit(f'line match target count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  if (!userId) return { skipped: true, reason: 'member_resolution_failed' };\n\n  await db.prepare(`\n"""
          new = """  if (!userId) return { skipped: true, reason: 'member_resolution_failed' };\n\n  if (matchedByLine && memberNo) {\n    const profile = await db.prepare(`\n      SELECT roster_member_number, company_member_number\n      FROM member_profiles\n      WHERE platform_user_id = ?\n      LIMIT 1\n    `).bind(userId).first();\n    const existingMemberNos = [profile?.roster_member_number, profile?.company_member_number]\n      .map((value) => clean(value, 120).toUpperCase())\n      .filter(Boolean);\n    const existingMemberNo = existingMemberNos.find((value) => value !== memberNo) || '';\n    if (existingMemberNo) {\n      return {\n        skipped: true,\n        reason: 'line_uid_member_no_conflict',\n        userId,\n        lineUserId,\n        memberNo,\n        existingMemberNo,\n      };\n    }\n  }\n\n  await db.prepare(`\n"""
          if text.count(old) != 1:
              raise SystemExit(f'profile update target count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    const summary = { received: members.length, initialized: 0, existing: 0, skipped: 0, createdMembers: 0, attachedLineIds: 0, errors: [] };\n"""
          new = """    const summary = { received: members.length, initialized: 0, existing: 0, skipped: 0, createdMembers: 0, attachedLineIds: 0, conflicts: [], errors: [] };\n"""
          if text.count(old) != 1:
              raise SystemExit(f'summary target count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        if (member.skipped) {\n          summary.skipped += 1;\n          results.push({ memberNo: clean(row?.memberNo, 120), success: false, reason: member.reason });\n          continue;\n        }\n"""
          new = """        if (member.skipped) {\n          summary.skipped += 1;\n          const skippedResult = {\n            memberNo: clean(row?.memberNo, 120),\n            lineUserId: clean(row?.lineUserId, 256),\n            success: false,\n            reason: member.reason,\n            existingMemberNo: member.existingMemberNo || '',\n          };\n          if (member.reason === 'line_uid_member_no_conflict') summary.conflicts.push(skippedResult);\n          results.push(skippedResult);\n          continue;\n        }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'skipped target count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify patch
        shell: bash
        run: |
          node --check src/tdea-point-service.js
          grep -q "line_uid_member_no_conflict" src/tdea-point-service.js
          grep -q "conflicts: \[\]" src/tdea-point-service.js
          git diff --check
          git diff --stat

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tdea-point-service.js
          git rm .github/workflows/guard-line-uid-member-conflict-once.yml
          git commit -m 'Guard LINE UID member number conflicts'
          git push origin HEAD:fix/line-uid-member-conflict
