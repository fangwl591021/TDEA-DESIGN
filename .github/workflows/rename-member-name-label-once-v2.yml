name: Rename member name label once v2
on:
  push:
    paths:
      - '.github/workflows/rename-member-name-label-once-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Replace registration name label only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          pattern=re.compile(r'姓名\s*[/／]\s*公司名稱')
          for p in list(Path('public').rglob('*.js')) + list(Path('public').rglob('*.html')):
              s=p.read_text(encoding='utf-8')
              n,count=pattern.subn('姓名',s)
              if count:
                  p.write_text(n,encoding='utf-8')
                  changed.append((str(p),count))
          if not changed:
              raise SystemExit('target label not found')
          print(changed)
          PY
      - name: Verify
        run: |
          node --check public/app-20260803-123.js
          ! grep -R -E '姓名[[:space:]]*[/／][[:space:]]*公司名稱' public --include='*.js' --include='*.html'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m 'Rename registration name label to 姓名'
          git push origin HEAD:agent/full-project-transplant
