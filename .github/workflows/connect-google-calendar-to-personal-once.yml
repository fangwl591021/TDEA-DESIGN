name: Connect Google calendar to personal once
on:
  push:
    branches:
      - agent/full-project-transplant
    paths:
      - .github/workflows/connect-google-calendar-to-personal-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-project-transplant
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/connect-google-calendar-to-personal.py
      - name: Verify
        run: |
          node --check src/index.js
          grep -q 'Google calendar bridge failed' src/index.js
          grep -q 'env.TDEA_WORKER.fetch' src/index.js
      - name: Commit and cleanup
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/index.js
          git commit -m "Show Google Calendar activities in personal calendar"
          git rm .github/workflows/connect-google-calendar-to-personal-once.yml .github/scripts/connect-google-calendar-to-personal.py
          git commit -m "Remove one-time Google calendar bridge patch files"
          git push origin agent/full-project-transplant
