<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TDEA 商務中心</title><link rel="stylesheet" href="/styles.css?v=20260812-144"><link rel="stylesheet" href="/akaffit-20260801-41.css?v=20260812-138"><link rel="stylesheet" href="/task-engine-20260729-3.css">
  <link rel="stylesheet" href="/vendor/cropper.min.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="/vendor/cropper.min.js"></script>
</head>
<body><main id="app"><section id="loading" class="center">載入會員中心…</section></main><script type="module" src="/app-20260803-123.js?v=20260814-145"></script>
<script>
(()=>{
  let busy=false,scanValue='';
  const token=()=>localStorage.getItem('klinkweb_session')||'';
  const api=async(path,options={})=>{const headers={...(token()?{authorization:`Bearer ${token()}`}:{})};if(options.body)headers['content-type']='application/json';const r=await fetch(path,{credentials:'same-origin',...options,headers:{...headers,...(options.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`操作失敗 (${r.status})`);return j};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const close=()=>document.querySelector('#tdeaPointScanModal')?.remove();
  const modal=html=>{close();const d=document.createElement('div');d.id='tdeaPointScanModal';d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#2f1d16aa;display:grid;place-items:center;padding:18px';d.innerHTML=`<section style="width:min(430px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:20px;color:#3d2920;box-shadow:0 18px 50px #0004">${html}</section>`;d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))close()});document.body.appendChild(d);return d};
  const showMember=data=>{const m=data.member||{},w=data.wallet||{},c=data.capabilities||{};const d=modal(`<div style="display:flex;justify-content:space-between;align-items:center"><div><small>TDEA 點數收銀台</small><h2 style="margin:4px 0;color:#b95121">會員點數操作</h2></div><button data-x style="border:0;border-radius:50%;width:40px;height:40px;background:#b95121;color:white;font-size:24px">×</button></div><div style="margin:16px 0;padding:14px;border-radius:14px;background:#fff6f0"><strong>${esc(m.displayName||'會員')}</strong><div>${esc(m.memberNumber||'')}</div></div><div>目前點數</div><div style="font-size:34px;font-weight:900;color:#b95121">${Number(w.balance||0).toLocaleString('zh-TW')} 點</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">${c.canCreditPoints?'<button data-act="grant" style="min-height:48px;border:0;border-radius:14px;font-weight:800;background:#e8f6ee;color:#137347">＋ 贈點</button>':''}${c.canDebitPoints?'<button data-act="deduct" style="min-height:48px;border:0;border-radius:14px;font-weight:800;background:#fff0ec;color:#b43b22">－ 扣點</button>':''}</div>`);d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>adjust(data,b.dataset.act));};
  const adjust=(data,action)=>{const deduct=action==='deduct',current=Number(data.wallet?.balance||0);const d=modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;color:#b95121">${deduct?'扣除':'贈送'}點數</h2><button data-x style="border:0;border-radius:50%;width:40px;height:40px;background:#b95121;color:white;font-size:24px">×</button></div><p>目前餘額：<b>${current.toLocaleString('zh-TW')} 點</b></p><label style="display:grid;gap:6px;margin:12px 0">點數<input id="psAmt" type="number" min="1" step="1" style="padding:12px;border:1px solid #dcc8bd;border-radius:10px"></label><label style="display:grid;gap:6px;margin:12px 0">${deduct?'用途':'原因'}<textarea id="psReason" rows="3" style="padding:12px;border:1px solid #dcc8bd;border-radius:10px"></textarea></label><button id="psGo" style="width:100%;min-height:48px;border:0;border-radius:14px;background:#b95121;color:#fff;font-weight:800">確認${deduct?'扣點':'贈點'}</button>`);d.querySelector('#psGo').onclick=async()=>{const points=Number(d.querySelector('#psAmt').value),reason=d.querySelector('#psReason').value.trim();if(!Number.isInteger(points)||points<=0)return alert('請輸入正整數點數');if(!reason)return alert('請輸入原因');if(deduct&&points>current)return alert('扣除點數不可超過目前餘額');if(!confirm(`確認${deduct?'扣除':'贈送'} ${points} 點？`))return;try{const r=await api('/v1/point-operator/adjust',{method:'POST',body:JSON.stringify({value:scanValue,action,points,reason})});modal(`<button data-x style="float:right;border:0;border-radius:50%;width:40px;height:40px;background:#b95121;color:white;font-size:24px">×</button><h2 style="color:#b95121">${deduct?'扣點':'贈點'}成功</h2><p>${esc(r.member?.displayName||'')}</p><div style="font-size:34px;font-weight:900;color:#b95121">${Number(r.wallet?.balance||0).toLocaleString('zh-TW')} 點</div><p>本次 QR Code 已失效。</p>`)}catch(e){alert(e.message)}}};
  const start=async()=>{if(busy)return;busy=true;try{modal('<h2 style="color:#b95121">TDEA 點數掃碼</h2><p>正在檢查操作權限…</p>');const access=await api('/v1/point-operator/access');if(!access.capabilities?.canScanPoints)throw new Error('此功能僅限授權點數管理人員使用');if(!window.liff)throw new Error('LINE LIFF 尚未載入');if(!liff.getOS||!liff.isInClient)throw new Error('LIFF SDK 尚未就緒');if(typeof liff.scanCodeV2!=='function')throw new Error('目前 LIFF 不支援 Scan QR，請確認 LIFF 為 Full 並啟用 Scan QR');close();const result=await liff.scanCodeV2();scanValue=String(result?.value||'').trim();if(!scanValue)return;modal('<h2 style="color:#b95121">已掃描</h2><p>正在讀取會員資料…</p>');const preview=await api('/v1/point-operator/preview',{method:'POST',body:JSON.stringify({value:scanValue})});showMember(preview)}catch(e){close();if(!/cancel/i.test(String(e?.message||'')))alert(e.message||'掃碼失敗')}finally{busy=false}};
  document.addEventListener('click',e=>{const t=e.target instanceof Element?e.target.closest('.ak-member-avatar'):null;if(!t)return;e.preventDefault();e.stopImmediatePropagation();start()},true);
})();
</script></body>
</html>
